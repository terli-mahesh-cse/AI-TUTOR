{% extends "base.html" %}

{% block title %}Create Account — AI-Tutor{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white dark:bg-darkCard p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigoPrimary to-mintAccent text-white flex items-center justify-center mx-auto mb-3 shadow-md shadow-indigo-500/20">
                <i data-lucide="sparkles" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-heading font-bold text-slate-900 dark:text-white">Start Learning Free</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Join thousands of students mastering complex subjects</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/50 flex items-center space-x-3 text-rose-600 dark:text-rose-400 text-sm">
            <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form -->
        <form action="/auth/signup" method="POST" class="space-y-5" hx-post="/auth/signup" hx-target="body">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" name="full_name" value="{{ full_name or '' }}" required placeholder="Alex Johnson"
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigoPrimary focus:bg-white dark:focus:bg-slate-900 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                    <input type="email" name="email" value="{{ email or '' }}" required placeholder="student@example.com"
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigoPrimary focus:bg-white dark:focus:bg-slate-900 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="key-round" class="w-4 h-4"></i>
                    </span>
                    <input type="password" name="password" required placeholder="At least 6 characters" minlength="6"
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigoPrimary focus:bg-white dark:focus:bg-slate-900 transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-indigoPrimary hover:bg-indigoHover text-white font-semibold text-sm shadow-md shadow-indigo-500/20 hover:shadow-indigo-500/30 transition-all">
                Create Free Account
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-500 dark:text-slate-400">
            Already have an account? 
            <a href="/auth/login" class="font-semibold text-indigoPrimary hover:underline ml-1">Sign in here</a>
        </div>

    </div>
</div>
{% endblock %}
